server {
    listen 80;
    server_name api.holadohi.hu;

    # Let's Encrypt ACME challenge — a certbot ezen az útvonalon
    # igazolja, hogy a domain valóban a mi szerverünkre mutat.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Minden egyéb HTTP kérést átirányítunk HTTPS-re.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.holadohi.hu;

    # --- SSL tanúsítványok (Let's Encrypt / Certbot) ---
    ssl_certificate     /etc/letsencrypt/live/api.holadohi.hu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.holadohi.hu/privkey.pem;

    # --- Modern SSL beállítások ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # --- HSTS — böngészők megjegyzik, hogy HTTPS-en kell kapcsolódni ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # --- Gzip tömörítés ---
    # A JSON response-ok méretét ~70-85%-kal csökkenti.
    # 500 bolt adata ~200-400 KB helyett ~30-50 KB-ra zsugorodik.
    gzip on;
    gzip_types application/json text/plain application/javascript text/css;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;

    # --- Reverse proxy a NestJS backend felé ---
    location / {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}